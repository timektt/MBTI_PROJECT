name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GITHUB_ID: ci-github-id
      GITHUB_SECRET: ci-github-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mbti_project
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mbti_project
      EMAIL_SERVER_HOST: localhost
      EMAIL_SERVER_PORT: 1025
      EMAIL_SERVER_SECURE: "false"
      EMAIL_SERVER_USER: ci-email-user
      EMAIL_SERVER_PASSWORD: ci-email-password
      EMAIL_FROM: ci@example.com
      PUSHER_APP_ID: ci-pusher-app-id
      PUSHER_KEY: ci-pusher-key
      PUSHER_SECRET: ci-pusher-secret
      PUSHER_CLUSTER: ap1
      NEXT_PUBLIC_PUSHER_KEY: ci-public-pusher-key
      NEXT_PUBLIC_PUSHER_CLUSTER: ap1
      CLOUDINARY_CLOUD_NAME: ci-cloud-name
      CLOUDINARY_API_KEY: ci-cloudinary-api-key
      CLOUDINARY_API_SECRET: ci-cloudinary-api-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify application
        run: npm run verify
